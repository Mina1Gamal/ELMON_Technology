<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الأعمال | ELMON Technology</title>
    <meta name="theme-color" content="#050816">
    <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050816;
            --bg-card: #0f172a;
            --bg-card-hover: #1e293b;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #22d3ee;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --gradient: linear-gradient(135deg, #6366f1 0%, #22d3ee 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.7; overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        img { display: block; max-width: 100%; }

        .bg-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(34, 211, 238, 0.12) 0%, transparent 40%);
        }

        header {
            background: rgba(5, 8, 22, 0.75);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.6rem; font-weight: 900; display: flex; align-items: center; gap: 0.5rem; }
        .logo-icon {
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 900; color: #fff;
            box-shadow: 0 0 25px var(--primary-glow);
        }
        .logo-text { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-text span { -webkit-text-fill-color: var(--text-main); color: var(--text-main); }
        nav ul { display: flex; list-style: none; gap: 2rem; align-items: center; }
        nav a { font-weight: 600; color: var(--text-muted); transition: 0.3s; position: relative; padding: 0.5rem 0; }
        nav a::after { content: ''; position: absolute; bottom: 0; right: 0; width: 0; height: 2px; background: var(--gradient); transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a:hover::after, nav a.active::after { width: 100%; }
        
        .admin-only-link a {
            color: var(--accent);
            background: rgba(34, 211, 238, 0.1);
            padding: 0.4rem 0.9rem !important;
            border-radius: 8px;
            border: 1px solid rgba(34, 211, 238, 0.3);
        }
        .admin-only-link a::after { display: none; }
        .admin-only-link a:hover { background: rgba(34, 211, 238, 0.2); }
        
        .btn-cta {
            background: var(--gradient); color: #fff; padding: 0.65rem 1.5rem;
            border-radius: 50px; font-weight: 700; transition: 0.3s;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .btn-cta:hover { transform: translateY(-2px); }
        .mobile-toggle { display: none; background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }

        .page-header {
            text-align: center; padding: 5rem 5% 2rem; max-width: 800px; margin: 0 auto;
        }
        .page-header .eyebrow { color: var(--primary-light); font-weight: 700; font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; display: block; margin-bottom: 0.8rem; }
        .page-header h1 { font-size: 2.8rem; margin-bottom: 1rem; font-weight: 900; }
        .page-header h1 .gradient-text { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-header p { color: var(--text-muted); font-size: 1.1rem; }

        .controls {
            max-width: 1200px; margin: 0 auto 2.5rem; padding: 0 5%;
            display: flex; flex-direction: column; gap: 1.5rem; align-items: center;
        }
        .search-box {
            width: 100%; max-width: 550px; padding: 1rem 1.5rem;
            background: rgba(15, 23, 42, 0.7); border: 1px solid var(--border);
            border-radius: 50px; color: var(--text-main); font-size: 1rem; outline: none;
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-glow); }
        .filter-btns { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; }
        .filter-btn {
            background: rgba(15, 23, 42, 0.7); color: var(--text-muted); 
            border: 1px solid var(--border);
            padding: 0.6rem 1.4rem; border-radius: 50px; cursor: pointer; 
            font-weight: 700; transition: 0.3s; font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--gradient); color: #fff; border-color: transparent;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .section { padding: 0 5% 5rem; max-width: 1200px; margin: 0 auto; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

        .project-card {
            background: rgba(15, 23, 42, 0.7); border-radius: 20px; overflow: hidden;
            border: 1px solid var(--border); display: flex; flex-direction: column;
            transition: 0.4s;
        }
        .project-card:hover { 
            transform: translateY(-8px); 
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.15);
        }
        .project-img-wrap { position: relative; overflow: hidden; height: 220px; }
        .project-img { width: 100%; height: 100%; object-fit: cover; background: #0b1120; transition: 0.5s; }
        .project-card:hover .project-img { transform: scale(1.08); }
        .project-body { padding: 1.8rem; flex: 1; display: flex; flex-direction: column; }
        .project-cat {
            font-size: 0.8rem; color: var(--accent); font-weight: 700;
            background: rgba(34, 211, 238, 0.1);
            padding: 0.25rem 0.8rem; border-radius: 50px;
            display: inline-block; width: fit-content; margin-bottom: 0.6rem;
            border: 1px solid rgba(34, 211, 238, 0.2);
        }
        .project-title { font-size: 1.3rem; margin-bottom: 0.7rem; font-weight: 700; }
        .project-desc { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 1.5rem; flex: 1; }
        .project-link {
            display: block; text-align: center; background: rgba(99, 102, 241, 0.1);
            color: var(--primary-light); padding: 0.75rem; border-radius: 10px; font-weight: 700;
            border: 1px solid rgba(99, 102, 241, 0.3); transition: 0.3s;
        }
        .project-link:hover { background: var(--primary); color: #fff; }

        .no-results { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 4rem 2rem; }
        .no-results .icon { font-size: 3rem; margin-bottom: 1rem; }

        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        footer {
            border-top: 1px solid var(--border); padding: 2.5rem 5%;
            text-align: center; color: var(--text-muted);
            background: rgba(5, 8, 22, 0.8);
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 2rem; }
            nav ul { 
                display: none; position: absolute; top: 100%; right: 0; left: 0;
                flex-direction: column; gap: 0;
                background: rgba(5, 8, 22, 0.98);
                padding: 1rem; border-bottom: 1px solid var(--border);
            }
            nav ul.open { display: flex; }
            nav ul li { padding: 0.8rem 0; border-bottom: 1px solid var(--border); width: 100%; }
            .mobile-toggle { display: block; }
        }

.hero .badge,.hero h1,.hero>p,.hero .hero-btns,.hero .stats-bar,.page-header>*{animation:rise .9s var(--ease) both}

.stats-bar .stat-item{transition:transform .4s var(--ease)}
.stats-bar .stat-item:hover{transform:translateY(-4px)}
.search-box,.filter-btn,input,select,textarea{transition:border-color .3s,box-shadow .3s,background .3s,color .3s,transform .3s var(--ease)}

footer{position:relative}
footer::before{content:"";position:absolute;top:-1px;right:10%;left:10%;height:1px;background:linear-gradient(90deg,transparent,var(--primary),var(--accent),transparent)}

@media(max-width:768px){header{gap:.6rem}.logo{font-size:.95rem;gap:.35rem}.btn-cta{flex-shrink:0}.logo-text{white-space:nowrap}.logo-icon{width:34px;height:34px}.btn-cta{padding:.5rem .9rem;font-size:.85rem;white-space:nowrap;margin-inline-start:auto}.btn-cta span{display:none}}
/* performance: skip rendering offscreen sections until needed */

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const sampleProjects = [
            {
                title: "متجر الأميرات للأزياء",
                category: "متاجر إلكترونية",
                desc: "متجر إلكتروني متكامل لعرض الملابس مع فلترة ذكية حسب المقاس واللون والسعر وسلة مشتريات تفاعلية.",
                image: "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=600&q=80",
                url: "https://alamirat.vercel.app/"
            },
            {
                title: "نظام إدارة مبيعات ومخازن",
                category: "أنظمة إدارة",
                desc: "لوحة تحكم سحابية لمتابعة الطلبات اليومية، حالة الشحن، وتقارير الأرباح الفورية.",
                image: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80",
                url: "#"
            },
            {
                title: "منصة عقارية تفاعلية",
                category: "مواقع شركات",
                desc: "موقع تعريفي لشركة تطوير عقاري لعرض الوحدات السكنية والتواصل المباشر مع فريق المبيعات.",
                image: "https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=600&q=80",
                url: "#"
            },
            {
                title: "متجر إلكترونيات وإكسسوارات",
                category: "متاجر إلكترونية",
                desc: "متجر سريع يدعم مقارنة المنتجات وعروض الخصومات مع لوحة إدارة مبسطة.",
                image: "https://images.unsplash.com/photo-1498049794561-7780e7231661?auto=format&fit=crop&w=600&q=80",
                url: "#"
            }
        ];

        let allProjects = [];
        let currentCategory = 'الكل';
        let searchTerm = '';
        let db = null;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Firebase init failed:", e.message);
        }

        const container = document.getElementById('projects-container');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderSkeletons() {
            container.innerHTML = Array(4).fill(0).map(() => `
                <div class="project-card">
                    <div class="skeleton" style="height:220px;"></div>
                    <div class="project-body">
                        <div class="skeleton" style="height:20px;width:40%;margin-bottom:1rem;"></div>
                        <div class="skeleton" style="height:24px;width:80%;margin-bottom:1rem;"></div>
                        <div class="skeleton" style="height:60px;margin-bottom:1rem;"></div>
                    </div>
                </div>
            `).join('');
        }

        function renderProjects(list) {
            container.innerHTML = '';
            if (list.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="icon">🔍</div>
                        <h3>لا توجد مشاريع تطابق بحثك</h3>
                        <p>جرب تغيير كلمات البحث أو الفلتر</p>
                    </div>
                `;
                return;
            }
            list.forEach((proj, i) => {
                container.innerHTML += `
                    <div class="project-card" style="animation: fadeIn 0.5s ease ${i * 0.05}s both;">
                        <div class="project-img-wrap">
                            <img src="${proj.image}" alt="${proj.title}" class="project-img" loading="lazy" decoding="async">
                        </div>
                        <div class="project-body">
                            <span class="project-cat">${proj.category}</span>
                            <h3 class="project-title">${proj.title}</h3>
                            <p class="project-desc">${proj.desc}</p>
                            <a href="${proj.url}" target="_blank" class="project-link">معاينة المشروع حياً →</a>
                        </div>
                    </div>
                `;
            });
        }

        function filterData() {
            const term = searchTerm.toLowerCase().trim();
            const filtered = allProjects.filter(p => {
                const matchesCat = currentCategory === 'الكل' || p.category === currentCategory;
                const matchesSearch = !term || 
                    p.title.toLowerCase().includes(term) || 
                    p.desc.toLowerCase().includes(term) ||
                    p.category.toLowerCase().includes(term);
                return matchesCat && matchesSearch;
            });
            renderProjects(filtered);
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.cat;
                filterData();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            filterData();
        });

        async function loadProjects() {
            renderSkeletons();
            try {
                if (db && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                    const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
                    const snapshot = await getDocs(q);
                    allProjects = snapshot.empty 
                        ? sampleProjects 
                        : snapshot.docs.map(d => d.data());
                } else {
                    allProjects = sampleProjects;
                }
                renderProjects(allProjects);
            } catch (e) {
                console.warn("Using samples:", e.message);
                allProjects = sampleProjects;
                renderProjects(allProjects);
            }
        }

        loadProjects();
    </script>

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

var h=d.querySelector('header'),tick=false;
function upd(){var m=de.scrollHeight-innerHeight;bar.style.transform='scaleX('+(m>0?scrollY/m:0)+')';if(h)h.classList.toggle('scrolled',scrollY>24);tick=false}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});upd();
if(rm)return;
de.classList.add('js');
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
function scan(root){
 root.querySelectorAll('.section-title,.service-card,.project-card,.view-all-box,.footer-content,.footer-bottom').forEach(function(el){
  if(el.dataset.rv||(el.getAttribute('style')||'').indexOf('animation')>-1)return;
  el.dataset.rv=1;var p=el.parentElement,i=[].indexOf.call(p.children,el);
  el.style.setProperty('--d',(Math.min(i,6)*.08)+'s');el.classList.add('reveal');io.observe(el)})}
scan(d);
d.querySelectorAll('.grid-3').forEach(function(g){new MutationObserver(function(){scan(g)}).observe(g,{childList:true})});
d.addEventListener('pointermove',function(e){var c=e.target.closest&&e.target.closest('.service-card,.project-card');if(!c)return;var r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')},{passive:true});
})();
</script>
